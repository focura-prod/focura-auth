name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.prev_tag.outputs.tag }}"
          CURRENT="${{ github.ref_name }}"
          
          if [ -z "$TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${TAG}..HEAD)
          fi
          
          # Read package versions
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          NEXT_VERSION=$(node -p "require('./packages/next/package.json').version")
          
          # Build body
          cat << EOF > release_body.md
          ## What's Changed
          
          ${COMMITS}
          
          ## Packages
          
          | Package | Version |
          |---------|---------|
          | @gablura/auth-core | ${CORE_VERSION} |
          | @gablura/auth-next | ${NEXT_VERSION} |
          
          ## Install
          
          \`\`\`bash
          npm install @gablura/auth-core@${CORE_VERSION} @gablura/auth-next@${NEXT_VERSION}
          \`\`\`
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...${CURRENT}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
