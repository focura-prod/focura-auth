name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test with coverage
        run: pnpm -r test -- --coverage
      - name: Upload core coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core-${{ matrix.node-version }}
          path: packages/core/coverage/lcov.info
          if-no-files-found: error
      - name: Upload next coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-next-${{ matrix.node-version }}
          path: packages/next/coverage/lcov.info
          if-no-files-found: error